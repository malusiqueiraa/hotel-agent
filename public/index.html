<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hotel Estrella</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>Hotel Estrella</h1>

      <!-- Seven-day weather strip. Filled in by app.js. -->
      <section class="weather" aria-label="Seven day weather">
        <div id="weather-strip" class="weather-strip">
          <p class="weather-loading">Loading the weather.</p>
        </div>
      </section>

      <p class="intro">
        Send us a message and we will reply here. Please tell us your name,
        your e-mail, and how we can help.
      </p>

      <form id="message-form" novalidate>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />

        <label for="message">Please leave your message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" id="send">Send</button>
      </form>

      <!-- The reply appears here, under the form. -->
      <section id="reply" class="reply" aria-live="polite"></section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
